name: CI

on:
  # Verify the trunk directly as well as PRs: a squash-merge lands on master as
  # a plain commit with no pull_request event, so without this a merge could
  # break master without any check going red. Scoping push to master (rather
  # than all branches) keeps PR-branch commits from being built twice.
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report every Node version's result rather than cancelling the matrix on
      # the first failure - a break on one version only is the useful signal.
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json "engines"; 24 is current LTS.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable corepack
        # Yarn 4 comes from the packageManager field in package.json, and
        # Corepack has to be switched on explicitly. This must run after
        # setup-node: installing Node replaces the bin directory the Corepack
        # shims live in, which would throw them away.
        run: corepack enable

      # setup-node's own `cache: yarn` is not usable with Yarn 4 here. It
      # probes `yarn --version` before Corepack is enabled, sees the Yarn 1
      # that ships on the runner image, and caches the Yarn 1 directory, which
      # Yarn 4 never reads. Cache the real Yarn 4 cache folder instead.
      - name: Locate the yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-node${{ matrix.node }}-

      # --immutable is Yarn 4's equivalent of Yarn 1's --frozen-lockfile: it
      # fails rather than silently updating yarn.lock.
      - run: yarn install --immutable

      # `yarn test` is jest followed by `tsc --noEmit`, so this covers both the
      # test suite and the typecheck.
      - run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        # Yarn 4 comes from the packageManager field in package.json, and
        # Corepack has to be switched on explicitly. This must run after
        # setup-node: installing Node replaces the bin directory the Corepack
        # shims live in, which would throw them away.
        run: corepack enable

      # setup-node's own `cache: yarn` is not usable with Yarn 4 here. It
      # probes `yarn --version` before Corepack is enabled, sees the Yarn 1
      # that ships on the runner image, and caches the Yarn 1 directory, which
      # Yarn 4 never reads. Cache the real Yarn 4 cache folder instead.
      - name: Locate the yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-node24-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-node24-

      # --immutable is Yarn 4's equivalent of Yarn 1's --frozen-lockfile: it
      # fails rather than silently updating yarn.lock.
      - run: yarn install --immutable

      # Builds the jison parser, compiles to dist/, and renders the typedoc
      # site - the same three steps the release runs, so a broken build is
      # caught on the PR rather than at publish time.
      - run: yarn build

      # src/parser.js is generated from src/planout.jison but committed to the
      # repo, so the two can silently diverge if someone edits the grammar
      # without rebuilding. Regenerating it above and diffing here catches that.
      #
      # docs/ is deliberately NOT drift-checked even though it is committed:
      # its contents change with every typedoc release, which would turn a
      # routine typedoc bump into a red build and block Renovate automerge.
      - name: Check generated parser is in sync with the grammar
        run: |
          if ! git diff --exit-code -- src/parser.js; then
            echo "::error::src/parser.js is out of date. Run 'yarn build:compiler' and commit the result."
            exit 1
          fi
