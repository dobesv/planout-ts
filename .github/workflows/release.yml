name: Release

on:
  push:
    branches: [master]
  # Lets you re-run the release step if a publish fails partway through
  # without having to push an empty commit.
  workflow_dispatch:

concurrency:
  # Never run two releases at once: a second run could publish a version the
  # first one is still tagging. Queue instead of cancelling so an in-flight
  # publish is not killed halfway.
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing: npm exchanges this short-lived OIDC
  # token for publish rights, so there is no npm token stored in this repo.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      # The default GITHUB_TOKEN cannot be used here. GitHub refuses to
      # trigger workflow runs from events it creates, so the "Version
      # Packages" pull request it opens gets no CI - the checks land in
      # `action_required` and, because master requires them, the release
      # cannot merge without someone approving the run by hand every time.
      # A GitHub App token is not subject to that restriction.
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # changesets needs the full history to work out which changesets are
          # new since the last release.
          fetch-depth: 0
          # changesets still runs git locally to build the release commit, even
          # though the push itself now goes through the GitHub API using the
          # github-token input below.
          token: ${{ steps.app-token.outputs.token }}

      # Deliberately no `registry-url:` here. It makes setup-node write an
      # .npmrc containing a literal `${NODE_AUTH_TOKEN}` placeholder, and
      # setup-node then calls `yarn cache dir` for the `cache: yarn` step.
      # Yarn 1 expands .npmrc environment variables eagerly and throws
      # "Failed to replace env in config" when the variable is unset, failing
      # the job before it ever reaches the publish step. Nothing needs it here
      # anyway - trusted publishing supplies the credential.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack
        # Yarn 4 comes from the packageManager field in package.json, and
        # Corepack has to be switched on explicitly. This must run after
        # setup-node: installing Node replaces the bin directory the Corepack
        # shims live in, which would throw them away.
        run: corepack enable

      # setup-node's own `cache: yarn` is not usable with Yarn 4 here. It
      # probes `yarn --version` before Corepack is enabled, sees the Yarn 1
      # that ships on the runner image, and caches the Yarn 1 directory, which
      # Yarn 4 never reads. Cache the real Yarn 4 cache folder instead.
      - name: Locate the yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-node24-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-node24-

      # --immutable is Yarn 4's equivalent of Yarn 1's --frozen-lockfile: it
      # fails rather than silently updating yarn.lock.
      - run: yarn install --immutable

      # Trusted publishing needs npm >= 11.5.1. Node 24 currently ships a new
      # enough npm, but that is a property of the runner image rather than
      # anything this repo controls. Assert it rather than upgrading npm on
      # every run: if a runner image ever ships something older, this fails
      # with a clear message instead of an opaque auth error at publish time.
      - name: Check npm supports trusted publishing
        run: |
          need=11.5.1
          have=$(npm --version)
          echo "npm $have"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "::error::npm $have is too old for trusted publishing (need >= $need)"
            exit 1
          fi

      # Two modes, decided by the action:
      #
      #   Pending changesets exist -> opens/updates a "Version Packages" PR
      #   that applies the version bump and rewrites CHANGELOG.md. Nothing is
      #   published.
      #
      #   No pending changesets (i.e. that PR was just merged) -> runs the
      #   publish script, which builds and pushes the package to npm, then
      #   tags the commit and creates the GitHub Release.
      #
      # So cutting a release is: merge PRs carrying changesets, then merge the
      # Version Packages PR the bot maintains.
      - name: Create version PR or publish to npm
        uses: changesets/action@v2
        with:
          # v2 removed support for supplying a token through the GITHUB_TOKEN
          # environment variable; it has to be this input. Credentials
          # persisted by actions/checkout are explicitly not a substitute.
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: yarn version-packages
          publish-script: yarn release
          pr-title: "Version Packages"
          commit-message: "Version packages"
