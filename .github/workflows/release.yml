name: Release

on:
  push:
    branches: [master]
  # Lets you re-run the release step if a publish fails partway through
  # (e.g. an expired NPM_TOKEN) without pushing an empty commit.
  workflow_dispatch:

concurrency:
  # Never run two releases at once: a second run could publish a version the
  # first one is still tagging. Queue instead of cancelling so an in-flight
  # publish is not killed halfway.
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets needs the full history to work out which changesets are
          # new since the last release.
          fetch-depth: 0

      # Deliberately no `registry-url:` here. That option makes setup-node
      # write an .npmrc containing a literal `${NODE_AUTH_TOKEN}` placeholder,
      # and setup-node then calls `yarn cache dir` for the `cache: yarn` step.
      # Yarn 1 expands environment variables in .npmrc eagerly and throws
      # "Failed to replace env in config" when the variable is not yet set,
      # which fails the job before it reaches the publish step. Authentication
      # is written explicitly below instead.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Authenticate with npm
        # Written to $HOME rather than the workspace so it can never be picked
        # up by the commit the changesets action makes.
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Two modes, decided by the action:
      #
      #   Pending changesets exist -> opens/updates a "Version Packages" PR
      #   that applies the version bump and rewrites CHANGELOG.md. Nothing is
      #   published.
      #
      #   No pending changesets (i.e. that PR was just merged) -> runs the
      #   publish script, which builds and pushes the package to npm, then
      #   tags the commit and creates the GitHub Release.
      #
      # So cutting a release is: merge PRs carrying changesets, then merge the
      # Version Packages PR the bot maintains.
      - name: Create version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          publish: yarn release
          title: "Version Packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
